name: Deploy to Hostinger

# Manual trigger only – add SFTP secrets first, then run from Actions tab
# Hostinger uses SFTP (port 65002), not FTP. Get server IP from hPanel → Advanced → SSH Access
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip

      - name: Install dependencies
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Deploy via SFTP
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: sftp
          remote-host: ${{ secrets.SFTP_SERVER }}
          remote-port: 65002
          remote-user: ${{ secrets.SFTP_USERNAME }}
          remote-password: ${{ secrets.SFTP_PASSWORD }}
          remote-path: ${{ secrets.SFTP_REMOTE_PATH }}
          local-path: ./
          sync: full
          ftp-mirror-options: '--exclude-glob=.git* --exclude-glob=.github --exclude-glob=node_modules --exclude-glob=.env* --exclude-glob=config.php --exclude-glob=debug.php --exclude-glob=temp/ --exclude-glob=*.md --exclude-glob=.gitignore'
