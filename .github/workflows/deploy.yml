name: Deploy to Hostinger

# Manual trigger only – add SFTP secrets first, then run from Actions tab
# Hostinger uses SFTP (port 65002), not FTP. Get server IP from hPanel → Advanced → SSH Access
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip

      - name: Install dependencies
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 65002
          sftp_only: true
          local_path: './'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          rsyncArgs: '--exclude=.git --exclude=.github --exclude=node_modules --exclude=.env --exclude=.env.* --exclude=config.php --exclude=debug.php --exclude=temp/ --exclude=*.md --exclude=.gitignore'
          sftpArgs: '-o ConnectTimeout=10'
